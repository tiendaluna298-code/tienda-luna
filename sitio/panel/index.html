<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24123b">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-title" content="Panel Luna">
<link rel="icon" href="../icon-panel-192.png">
<link rel="apple-touch-icon" href="../icon-panel-192.png">
<link rel="manifest" href="manifest.json">
<script src="../config.js"></script>
<title>Panel Tienda Luna</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: panel de trabajo — barra lateral nocturna con la luna (en celu: barra inferior), área clara con vistas Prendas / Costos y precios / Categorías / Ajustes; el editor ocupa la pantalla con la calculadora de precio fija a la derecha. */
:root{
  --night:#24123b; --night-2:#341c54; --on-night:#f4ecfb; --on-night-dim:#bba7d3;
  --bg:#f5f1f8; --surface:#ffffff; --surface-2:#f1ebf6; --line:#e4dbeb; --line-2:#d5c8e0;
  --fg:#231632; --muted:#6c5d7e;
  --violet:#5a2d8a; --violet-soft:#ede3f7; --on-violet:#ffffff;
  --gold:#c9a04a; --gold-ink:#8a671c; --gold-soft:#f7edd6;
  --ok:#2a7853; --ok-soft:#e0f2e8; --warn:#a4561b; --warn-soft:#fbebdd; --bad:#b0384a; --bad-soft:#fbe4e8;
  --shadow:0 12px 32px -14px rgba(36,18,59,.35);
  --f-display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --night:#0e0717; --night-2:#1b1030; --on-night:#f4ecfb; --on-night-dim:#ad9bc4;
  --bg:#140d1e; --surface:#1d1529; --surface-2:#261c36; --line:#33274a; --line-2:#45365f;
  --fg:#f0e8f7; --muted:#a898bd;
  --violet:#bc97ea; --violet-soft:#2d2044; --on-violet:#1a0f2a;
  --gold:#e2bf74; --gold-ink:#e2bf74; --gold-soft:#372a16;
  --ok:#72cf9f; --ok-soft:#18301f; --warn:#f0a868; --warn-soft:#3a2615; --bad:#f2899a; --bad-soft:#3a1820;
  --shadow:0 14px 34px -12px rgba(0,0,0,.65);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --night:#0e0717; --night-2:#1b1030; --on-night:#f4ecfb; --on-night-dim:#ad9bc4;
  --bg:#140d1e; --surface:#1d1529; --surface-2:#261c36; --line:#33274a; --line-2:#45365f;
  --fg:#f0e8f7; --muted:#a898bd;
  --violet:#bc97ea; --violet-soft:#2d2044; --on-violet:#1a0f2a;
  --gold:#e2bf74; --gold-ink:#e2bf74; --gold-soft:#372a16;
  --ok:#72cf9f; --ok-soft:#18301f; --warn:#f0a868; --warn-soft:#3a2615; --bad:#f2899a; --bad-soft:#3a1820;
  --shadow:0 14px 34px -12px rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 600px at 20% -10%,var(--night-2),var(--night) 60%);position:relative;overflow:hidden}
.login::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.3px 1.3px at 14% 24%,rgba(255,255,255,.55),transparent),radial-gradient(1px 1px at 72% 18%,rgba(255,255,255,.45),transparent),radial-gradient(1.5px 1.5px at 86% 66%,rgba(226,191,116,.8),transparent),radial-gradient(1px 1px at 40% 82%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 58% 40%,rgba(255,255,255,.3),transparent);pointer-events:none}
.lcard{position:relative;width:100%;max-width:380px;background:var(--surface);border-radius:22px;padding:30px 26px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);display:grid;gap:16px}
.lcard .moon{width:58px;height:58px;margin:0 auto}
.lcard h1{font-family:var(--f-display);font-weight:500;font-size:28px;text-align:center}
.lcard h1 i{font-style:italic}
.lcard p{margin:0;color:var(--muted);text-align:center;font-size:14px}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted)}
.chk input{accent-color:var(--violet);width:18px;height:18px;margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.side{background:var(--night);color:var(--on-night);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px;padding:22px 14px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:21px;line-height:1.05}
.brand small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-night-dim)}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--on-night-dim);padding:11px 12px;border-radius:12px;font-weight:600;font-size:14.5px;text-align:left;position:relative}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--on-night)}
.nav button[aria-current="page"]{background:rgba(226,191,116,.13);color:var(--on-night)}
.nav button[aria-current="page"] svg{color:#e2bf74}
.nav .badge{margin-left:auto;background:#e2bf74;color:#24123b;font-size:11px;font-weight:700;border-radius:9px;padding:1px 7px}
.sfoot{margin-top:auto;display:grid;gap:4px;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.sfoot a,.sfoot button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--on-night-dim);text-decoration:none;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:500;text-align:left}
.sfoot a:hover,.sfoot button:hover{color:var(--on-night);background:rgba(255,255,255,.05)}
.sfoot svg{width:18px;height:18px}
.demo-pill{margin:4px 12px 0;font-size:11.5px;color:#e2bf74;border:1px dashed rgba(226,191,116,.5);border-radius:8px;padding:5px 8px}
.mtop,.tabbar{display:none}
.main{min-width:0;padding:30px clamp(16px,3.2vw,44px) 70px}
.wrap{max-width:1180px;margin:0 auto}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--night);color:var(--on-night);padding:10px 16px}
  .mtop .brand{padding:0}
  .mtop .brand svg{width:32px;height:32px}
  .mtop .brand b{font-size:19px}
  .mtop a{color:var(--on-night-dim);display:flex;align-items:center;gap:6px;font-size:13.5px;text-decoration:none;font-weight:600}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px}
  .tabbar button[aria-current="page"]{color:var(--violet)}
  .tabbar svg{width:22px;height:22px}
  .main{padding:18px 16px 110px}
  body.editing .tabbar{display:none}
}

/* ---------- encabezado de vista ---------- */
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:14px 20px;flex-wrap:wrap;margin-bottom:22px}
.vh h1{font-family:var(--f-display);font-weight:500;font-size:clamp(27px,3.2vw,36px);line-height:1.05}
.vh p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.vh .acts{display:flex;gap:8px;flex-wrap:wrap}
.back{border:0;background:none;color:var(--violet);font-weight:600;padding:0;margin-bottom:8px;display:inline-flex;align-items:center;gap:6px}

/* ---------- botones / campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:14.5px;white-space:nowrap;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--violet);color:var(--on-violet)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);border-color:var(--line-2);color:var(--fg)}
.btn.ghost:hover{border-color:var(--violet)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--violet);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.field{display:grid;gap:6px;min-width:0}
.field>*{min-width:0}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field :where(input:not([type=radio]):not([type=checkbox])),.field select,.field textarea,.inp{width:100%;min-height:44px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);padding:9px 12px;font-size:15px}
.field :where(input:not([type=radio]):not([type=checkbox])):focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--violet);outline:none}
.field textarea{min-height:92px;resize:vertical}
.field small,.hint{color:var(--muted);font-size:12.5px}
.money{position:relative}
.money::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.money input{padding-left:26px}
.pct{position:relative}
.pct::after{content:"%";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.pct input{padding-right:28px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:14px}
.err{color:var(--bad);font-weight:600;font-size:13.5px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;cursor:pointer;font-weight:600;font-size:14px}
.choice label:has(input:checked){border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
.choice input{accent-color:var(--violet);margin:3px 0 0;flex:none}
.choice small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.choice label,.choice label>span,.togrow>div{min-width:0}
.switch{position:relative;width:44px;height:26px;flex:none;display:inline-block}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:13px;background:var(--line-2);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--violet)}
.switch input:checked+span::after{transform:translateX(18px)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pill.stock{background:var(--ok-soft);color:var(--ok)}
.pill.enc{background:var(--gold-soft);color:var(--gold-ink)}
.pill.hid{background:var(--surface-2);color:var(--muted)}
.pill.auto{background:var(--violet-soft);color:var(--violet)}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--fg)}
.ib svg{width:16px;height:16px}
.ib:hover:not(:disabled){border-color:var(--violet);color:var(--violet)}
.ib:disabled{opacity:.3;cursor:default}

/* ---------- tarjetas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card>h3,.ctitle{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:grid;gap:2px;text-align:left;min-width:0}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.stat b{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat small{font-size:12.5px;color:var(--muted)}
button.stat{cursor:pointer}
.stat.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-soft)}
.stat.warn b,.stat.warn span{color:var(--warn)}

/* ---------- lista de prendas ---------- */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1 1 240px;min-width:0}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{padding-left:40px}
.tools select{width:auto;min-width:160px}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pr{display:grid;grid-template-columns:52px minmax(0,2.2fr) 128px minmax(0,1.3fr) 112px 132px 50px 124px;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.pr.head{border-top:0;background:var(--surface-2);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-block:10px}
.pr:not(.head){cursor:pointer}
.pr:not(.head):hover{background:var(--surface-2)}
.pr img{width:52px;height:64px;object-fit:cover;border-radius:9px;background:var(--surface-2)}
.pr h4{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.c-talles{font-size:13px;color:var(--muted);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-talles s{opacity:.5}
.c-precio{font-weight:700;font-variant-numeric:tabular-nums}
.c-precio s{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.gain{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.gain small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.gain.pos{color:var(--ok)} .gain.neg{color:var(--bad)}
.nocost{font-size:12.5px;color:var(--warn);font-weight:600}
.c-acts{display:flex;gap:6px;justify-content:flex-end}
.m-only{display:none}
.emptybox{padding:44px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.emptybox h3{font-family:var(--f-display);font-weight:500;font-size:22px;color:var(--fg)}
@media (max-width:860px){
  .pr{grid-template-columns:52px minmax(0,1fr) auto;grid-template-areas:"img name vis" "img precio acts";gap:4px 12px;padding:10px 12px}
  .pr.head{display:none}
  .c-img{grid-area:img} .c-name{grid-area:name} .c-vis{grid-area:vis;justify-self:end} .c-precio{grid-area:precio;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap} .c-acts{grid-area:acts}
  .c-tipo,.c-talles,.c-gain{display:none}
  .c-precio s{display:inline}
  .m-only{display:inline}
  .c-acts .ib.mv{display:none}
}

/* ---------- editor ---------- */
.ed{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:18px;align-items:start}
.ed-side{position:sticky;top:20px;display:grid;gap:18px}
@media (max-width:1020px){.ed{grid-template-columns:minmax(0,1fr)}.ed-side{position:static}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pt{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--surface-2);max-width:100%}
.pt img{width:100%;height:100%;object-fit:cover}
.pt .rmx{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(15,8,25,.75);color:#fff;font-size:15px;line-height:1}
.pt .tagp{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;border:0;border-radius:6px;padding:3px 7px}
.pt .tagp.main{background:#e2bf74;color:#24123b}
.pt .tagp.mk{background:rgba(255,255,255,.9);color:#24123b}
.drop{border:1.5px dashed var(--line-2);border-radius:12px;aspect-ratio:4/5;display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface-2);text-align:center;padding:8px;max-width:100%}
.drop svg{width:26px;height:26px}
.drop.over{border-color:var(--violet);color:var(--violet);background:var(--violet-soft)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tch{display:inline-flex;align-items:center;border-radius:10px;border:1.5px solid var(--violet);background:var(--violet-soft);color:var(--violet);font-weight:700;font-size:14px;overflow:hidden}
.tch.no{border-color:var(--line-2);background:var(--surface);color:var(--muted);text-decoration:line-through}
.tch button{border:0;background:none;color:inherit;padding:8px 10px;font-weight:700}
.tch button+button{padding:8px 9px 8px 2px;opacity:.6;text-decoration:none}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px dashed var(--line-2);background:none;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.presets button:hover{color:var(--violet);border-color:var(--violet)}
.togrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.togrow:first-of-type{border-top:0;padding-top:0}
.togrow b{display:block;font-size:14.5px}
.togrow small{color:var(--muted);font-size:12.5px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.quick button[aria-pressed="true"]{border-color:var(--violet);color:var(--violet);background:var(--violet-soft)}
.pout{background:linear-gradient(150deg,var(--night),var(--night-2));color:var(--on-night);border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.pout .big{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pout .big span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-night-dim);font-weight:700}
.pout .big b{font-size:32px;font-weight:700;color:#e2bf74;font-variant-numeric:tabular-nums;line-height:1}
.pout .lines{display:grid;gap:4px;font-size:13.5px;color:var(--on-night-dim);font-variant-numeric:tabular-nums}
.pout .lines div{display:flex;justify-content:space-between;gap:10px}
.pout .lines .tot{color:var(--on-night);font-weight:700;border-top:1px dashed rgba(255,255,255,.18);padding-top:6px;margin-top:2px;font-size:14.5px}
.pout .lines .pos{color:#8fe0b4} .pout .lines .neg{color:#ff9fae}

/* ---------- pedidos ---------- */

@keyframes ring{8%,28%,48%{transform:rotate(16deg)}18%,38%{transform:rotate(-16deg)}60%{transform:none}}

.ord .ohead .loc{color:var(--muted);font-size:13.5px}
.code{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:2px 7px}
.oitems{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}

.oitems li>span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}

.ometa{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}

.onote{font-size:13.5px;background:var(--surface-2);border-radius:9px;padding:7px 10px}
.ord .oside{padding:14px 16px;border-left:1px solid var(--line);display:grid;align-content:space-between;gap:10px;justify-items:end}

.age.ok{background:var(--ok-soft);color:var(--ok)} .age.mid{background:var(--warn-soft);color:var(--warn)} .age.late{background:var(--bad-soft);color:var(--bad)} .age.done{background:var(--surface-2);color:var(--muted)}
.states{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.states button{border:1.5px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.states button:hover{color:var(--fg)}
.states button[aria-pressed="true"].s-nuevo{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink)}
.states button[aria-pressed="true"].s-confirmado{border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
.states button[aria-pressed="true"].s-entregado{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.states button[aria-pressed="true"].s-cancelado{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
@media (max-width:860px){
  .ord{grid-template-columns:minmax(0,1fr)}
  .ord .when{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;justify-items:start;padding:9px 14px}
  .ord .when b{font-size:17px}
  .ord .oside{border-left:0;border-top:1px solid var(--line);justify-items:stretch}
  .ord .otot{display:flex;justify-content:space-between;align-items:baseline;text-align:left;gap:10px}
  .states{justify-content:flex-start}
}
.modal{position:fixed;inset:0;z-index:70;background:rgba(15,8,25,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:18px;max-width:480px;width:100%;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h3{font-family:var(--f-display);font-weight:500;font-size:25px}
.modal ol{margin:0;padding-left:20px;display:grid;gap:8px}
.modal p{margin:0;color:var(--muted)}
.devcard{display:grid;gap:12px}
.devrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.devrow:first-of-type{border-top:0;padding-top:0}
.devrow b{display:block;font-size:14.5px}
.devrow small{display:block;color:var(--muted);font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

<body>

<script>
/* La URL de la planilla está en config.js (junto a la tienda). Sin config.js = modo demostración. */
const API_URL = (window.TL_CONFIG && window.TL_CONFIG.API_URL) || '';

const DEMO = !API_URL;
const DEMO_PASS = 'demo-' + Math.random().toString(36).slice(2);
const DB_KEY = 'tl_demo_v2';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ars = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(Number(n) || 0)).toLocaleString('es-AR');
const pctf = n => (n == null || !isFinite(n)) ? '—' : (Math.round(n * 10) / 10).toLocaleString('es-AR') + '%';
const money = v => Math.round(Number(String(v ?? '').replace(/[^\d]/g, '')) || 0);
const pnum = v => { const n = parseFloat(String(v ?? '').replace(',', '.').replace(/[^\d.\-]/g, '')); return isFinite(n) ? n : null; };
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const sess = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); }catch(e){} }
};
const parseList = v => { if (Array.isArray(v)) return v; try{ const a = JSON.parse(v); if (Array.isArray(a)) return a; }catch(e){} return String(v || '').split(',').map(s => s.trim()).filter(Boolean); };
const photoUrl = (f, w) => !f ? '' : (/^https:\/\/lh3\.googleusercontent\.com/.test(f.url) && !/=w\d+$/.test(f.url) ? f.url + '=w' + w : f.url);
const SVG = (d, extra = '') => '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"' + extra + '>' + d + '</svg>';
const IC = {
  prendas: SVG('<path d="M8 4l4 2 4-2 4 3-2 4-2-1v10H8V10l-2 1-2-4z"/>'),
  costos: SVG('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h4"/>'),

  plus: SVG('<path d="M12 5v14M5 12h14"/>'),

  up: SVG('<path d="M12 19V5M6 11l6-6 6 6"/>'),

  copy: SVG('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>'),
  back: SVG('<path d="M15 6l-6 6 6 6"/>'),
  trash: SVG('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  pedidos: SVG('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>'),
  bell: SVG('<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>'),

function demoPost(action, p){
  if (p.key !== DEMO_PASS) throw new Error('Clave incorrecta');
  const db = demoDB();
  const ordList = since => ({ orders: db.orders.filter(o => !since || o.actualizado >= since - 2000).sort((a, b) => b.fecha - a.fecha), now: Date.now() });
  if (action === 'changeKey') throw new Error('En la demostración la clave no se cambia. Con la planilla conectada sí.');
  if (action === 'orders') return ordList(0);
  if (action === 'ordersSince') return ordList(p.since);
  if (action === 'setOrderStatus'){ const o = db.orders.find(x => x.id === p.id); if (o){ o.estado = p.estado; o.actualizado = Date.now(); } store.set(DB_KEY, db); return ordList(0); }
  if (action === 'demoSimulate'){
    const nombres = ['Agustina Molina', 'Florencia Díaz', 'Julieta Sosa', 'Romina Castro', 'Micaela Vega'];
    const prods = db.products.filter(x => x.visible && x.precio);

    const now = Date.now(), A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = ''; for (let i = 0; i < 5; i++) code += A[Math.floor(Math.random() * A.length)];
    db.orders.push({ id: 'o' + now.toString(36), codigo: code, fecha: now, actualizado: now, estado: 'nuevo', nombre: nombres[Math.floor(Math.random() * nombres.length)], localidad: 'San Rafael', entrega: 'retiro', direccion: '', pago: 'Transferencia', modalidad: '', nota: '', contacto: '',
      items: [{ id: pr.id || '', nombre: pr.nombre, talle: ((pr.talles || [])[0] || {}).t || '', color: (pr.colores || [])[0] || '', cant: 1, precio: pr.precio, tipo: pr.tipo }], total: pr.precio, sena: 0 });
    store.set(DB_KEY, db); return { ok: true };
  }
  const upsert = pr => {
    if (!pr.id){ pr.id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); pr.orden = db.products.length; }
    pr.actualizado = Date.now();
    const i = db.products.findIndex(x => x.id === pr.id);
    if (i < 0) db.products.push(pr); else db.products[i] = pr;
  };
  if (action === 'uploadPhoto') return { id: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), url: p.data };
  if (action === 'saveProduct') upsert(p.product);
  if (action === 'saveProducts') p.products.forEach(upsert);
  if (action === 'deleteProduct') db.products = db.products.filter(x => x.id !== p.id);
  if (action === 'saveConfig') Object.assign(db.config, p.config);
  if (action === 'reorder') db.products.forEach(x => { const i = p.ids.indexOf(x.id); if (i >= 0) x.orden = i; });
  if (action === 'saveCategories'){
    db.products.forEach(x => { if (Object.prototype.hasOwnProperty.call(p.renames || {}, x.categoria)) x.categoria = p.renames[x.categoria]; });
    db.config.categorias = JSON.stringify(p.categorias);
  }
  db.products.sort((a, b) => a.orden - b.orden);
  if (!store.set(DB_KEY, db)) throw new Error('El navegador no tiene más espacio para fotos de prueba.');
  return db;
}

/* ---------------------------- precios ---------------------------- */
const gDefault = () => { const n = pnum(CFG.gananciaDefault); return n == null ? 60 : n; };
const comision = () => Math.min(90, Math.max(0, pnum(CFG.comisionCobro) || 0));
const redondeo = () => Math.max(0, money(CFG.redondeo));
const roundUp = (v, r) => r ? Math.ceil(v / r - 1e-9) * r : Math.round(v);
function pricing(p){
  const costo = Number(p.costo) || 0, gastos = Number(p.gastos) || 0, ct = costo + gastos;
  const gOwn = pnum(p.ganancia);
  const g = gOwn == null ? gDefault() : gOwn;
  const com = comision();
  const sugerido = ct ? roundUp(ct * (1 + g / 100) / (1 - com / 100), redondeo()) : 0;
  const auto = p.modoPrecio === 'auto' && ct > 0;
  const precio = auto ? sugerido : (Number(p.precio) || 0);
  const comMonto = precio * com / 100;
  const gan = ct ? precio - comMonto - ct : null;
  return { costo, gastos, ct, g, gOwn, com, comMonto, sugerido, auto, precio, gan,
    pctCosto: ct && gan != null ? gan / ct * 100 : null, margen: precio && gan != null ? gan / precio * 100 : null };
}

  editing = p ? JSON.parse(JSON.stringify(p)) : blankProduct();
  ['talles', 'fotos', 'colores'].forEach(k => editing[k] = editing[k] || []);
  if (editing.costo === 0) editing.costo = '';
  if (editing.gastos === 0) editing.gastos = '';
  if (!editing.precioAnterior) editing.precioAnterior = '';
  edDirty = false; confirmDel = false; edErr = ''; busy = '';
  go('editar', { force: true });
}

function readEditor(){
  if (!editing || !$('#edF')) return;
  const v = id => { const el = $(id); return el ? el.value : null; };
  const set = (k, x) => { if (x !== null) editing[k] = x; };
  set('nombre', v('#e-nombre') !== null ? v('#e-nombre').trim() : null);
  set('categoria', v('#e-cat'));
  const t = $('input[name="e-tipo"]:checked'); if (t) editing.tipo = t.value;
  if (v('#e-col') !== null) editing.colores = v('#e-col').split(',').map(s => s.trim()).filter(Boolean);
  set('descripcion', v('#e-desc'));
  if (v('#e-costo') !== null) editing.costo = v('#e-costo').replace(/[^\d]/g, '');
  if (v('#e-gastos') !== null) editing.gastos = v('#e-gastos').replace(/[^\d]/g, '');
  if (v('#e-gan') !== null) editing.ganancia = v('#e-gan').trim() === '' ? '' : (pnum(v('#e-gan')) ?? '');
  if (v('#e-precio') !== null) editing.precio = v('#e-precio').replace(/[^\d]/g, '');
  if (v('#e-ant') !== null) editing.precioAnterior = v('#e-ant').replace(/[^\d]/g, '');
  const vis = $('#e-vis'); if (vis) editing.visible = vis.checked;
  const de = $('#e-dest'); if (de) editing.destacado = de.checked;
}
function rerenderEditor(){ readEditor(); const y = window.scrollY; renderEditor(); window.scrollTo(0, y); }
async function saveEditor(){
  readEditor();
  const p = editing, r = pricing(p);
  edErr = '';
  if (!p.nombre) edErr = 'Poné un nombre a la prenda.';
  else if (!p.fotos.length) edErr = 'Agregá al menos una foto.';
  else if (p.modoPrecio === 'auto' && !r.ct) edErr = 'Cargá el costo para calcular el precio, o pasá a precio manual.';
  else if (!r.precio) edErr = 'Falta el precio de venta.';
  if (edErr){ rerenderEditor(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  try{
    const pend = p.fotos.filter(f => f.pending);
    for (let i = 0; i < pend.length; i++){
      busy = 'Subiendo foto ' + (i + 1) + ' de ' + pend.length + '…'; rerenderEditor();
      const up = await api('uploadPhoto', { data: pend[i].url, name: (p.nombre || 'foto').replace(/[^\w]+/g, '-').toLowerCase() });
      p.fotos[p.fotos.indexOf(pend[i])] = { id: up.id, url: up.url };
    }
    busy = 'Guardando…'; rerenderEditor();
    const prod = Object.assign({}, p, {
      precio: r.precio, precioAnterior: money(p.precioAnterior), costo: money(p.costo), gastos: money(p.gastos),
      ganancia: pnum(p.ganancia) == null ? '' : pnum(p.ganancia), modoPrecio: p.modoPrecio === 'auto' ? 'auto' : 'manual'
    });
    const nuevo = !p.id;
    setData(await api('saveProduct', { product: prod }));
    busy = ''; edDirty = false;
    toast(nuevo ? 'Prenda publicada' : 'Cambios guardados');
    go('prendas', { force: true });
  }catch(err){ busy = ''; edErr = 'No se pudo guardar: ' + err.message; rerenderEditor(); }
}
function compress(file, max){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', DEMO ? 0.72 : 0.84));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
async function addPhotos(files){
  readEditor();
  const list = [...files].filter(f => /^image\//.test(f.type)).slice(0, 10);
  for (const file of list){
    try{ editing.fotos.push({ pending: true, url: await compress(file, DEMO ? 700 : 1400) }); }
    catch(e){ toast('No se pudo leer una foto'); }
  }
  edDirty = true; rerenderEditor();
}

function costStats(){
  const rows = ALL.map(merged).map(p => ({ p, r: pricing(p) })).filter(x => x.r.ct && x.r.precio);
  const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
  return { n: rows.length, gan: avg(rows.map(x => x.r.gan)), pc: avg(rows.map(x => x.r.pctCosto)), mg: avg(rows.map(x => x.r.margen)), sin: ALL.length - rows.length, perd: rows.filter(x => x.r.gan < 0).length };
}

const sod = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const daysAgo = ts => Math.round((sod(Date.now()) - sod(ts)) / 864e5);
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
function dayTitle(ts){
  const n = daysAgo(ts), d = new Date(ts);
  const full = d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
  if (n === 0) return ['Hoy', full];
  if (n === 1) return ['Ayer', full];
  return [cap(full.replace(',', '')), n < 7 ? 'hace ' + n + ' días' : ''];
}
function rel(ts){
  const m = Math.max(0, Math.round((Date.now() - ts) / 6e4));
  if (m < 1) return 'recién';
  if (m < 60) return 'hace ' + m + ' min';
  const h = Math.round(m / 60);
  if (h < 24) return 'hace ' + h + ' h';
  const d = Math.floor(h / 24);
  return 'hace ' + d + (d === 1 ? ' día' : ' días');
}
function ageInfo(o){
  const h = (Date.now() - o.fecha) / 36e5, d = h / 24;
  if (o.estado === 'nuevo'){
    if (h < 12) return ['ok', 'Para responder'];
    return [h < 48 ? 'mid' : 'late', 'Sin responder · ' + rel(o.fecha)];
  }
  if (o.estado === 'confirmado'){
    const enc = (o.items || []).some(i => i.tipo === 'encargo');
    const lim = enc ? [10, 20] : [2, 4];
    const dd = Math.floor(d);
    return [d < lim[0] ? 'ok' : d < lim[1] ? 'mid' : 'late', (enc ? 'Encargo' : 'Para entregar') + ' · ' + (dd < 1 ? 'hoy' : 'día ' + dd)];
  }
  return ['done', o.estado === 'entregado' ? 'Entregado' : 'Cancelado'];
}

let actx = null;

function unlockAudio(){

    if (!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); actx.onstatechange = () => { if (view === 'pedidos') refreshAlerts(); }; }
    if (actx.state === 'suspended') actx.resume().catch(() => {});
  }catch(e){}
}
const audioReady = () => !!actx && actx.state === 'running';

function chime(){
  unlockAudio(); if (!actx) return;
  const t0 = actx.currentTime + 0.03;
  const strike = (t, f, vol) => [[1, 1], [2.76, .32], [5.4, .1]].forEach(([m, a]) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = f * m;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * a, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5 / m + 0.35);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 2.2);
  });
  strike(t0, 880, .3); strike(t0 + .2, 1174.66, .26); strike(t0 + .4, 1318.51, .3);
}
const notifPerm = () => ('Notification' in window) ? Notification.permission : 'unsupported';

function announce(fresh){
  const o = fresh[0];
  const title = fresh.length === 1 ? 'Nuevo pedido · ' + (o.nombre || 'Cliente') : 'Llegaron ' + fresh.length + ' pedidos nuevos';
  const body = fresh.length === 1 ? ars(o.total) + ' · ' + (o.items || []).map(i => i.cant + '× ' + i.nombre).join(', ') : fresh.map(x => (x.nombre || 'Cliente') + ' ' + ars(x.total)).join(' · ');

function mergeOrders(list, replace){
  const stored = store.get(KNOWN_KEY, null);
  const known = new Set(stored || []);
  const before = new Set(ORDERS.map(o => o.id));
  const byId = replace ? new Map() : new Map(ORDERS.map(o => [o.id, o]));
  const fresh = [];
  list.forEach(o => {
    o.fecha = Number(o.fecha) || 0; o.actualizado = Number(o.actualizado) || o.fecha; o.items = o.items || [];
    if (!before.has(o.id) && !known.has(o.id) && o.estado === 'nuevo') fresh.push(o);
    byId.set(o.id, o);
  });
  ORDERS = [...byId.values()].sort((a, b) => b.fecha - a.fecha);
  store.set(KNOWN_KEY, [...new Set([...ORDERS.map(o => o.id), ...known])].slice(0, 800));
  if (stored !== null && fresh.length) announce(fresh);
}
async function poll(){
  clearTimeout(pollT);

    const full = !ordersReady || Date.now() - lastFull > 5 * 6e4;
    const d = await api(full ? 'orders' : 'ordersSince', full ? {} : { since: ordersSince });
    ordersSince = d.now || Date.now();
    if (full) lastFull = Date.now();
    mergeOrders(d.orders || [], full);
    ordersReady = true; ordersErr = '';
  }catch(e){
    ordersErr = e.message;
    if (e.message === 'Clave incorrecta'){ logout(); return; }
  }
  updateBadges();
  if (view === 'pedidos') rerenderPedidos();
  pollT = setTimeout(poll, document.hidden ? 60000 : 30000);
}

  const L = ['Pedido #' + o.codigo + ' · ' + cap(new Date(o.fecha).toLocaleDateString('es-AR', { weekday: 'long' })) + ' ' + new Date(o.fecha).getDate() + '/' + (new Date(o.fecha).getMonth() + 1) + ' ' + hhmm(o.fecha), (o.nombre || '') + (o.localidad ? ' (' + o.localidad + ')' : '')];
  (o.items || []).forEach(i => L.push('• ' + i.cant + 'x ' + i.nombre + [i.talle, i.color].filter(Boolean).map(x => ' · ' + x).join('') + ' — ' + ars(i.precio * i.cant)));
  L.push('Total: ' + ars(o.total) + (o.sena ? ' (seña ' + ars(o.sena) + ')' : ''));
  L.push('Entrega: ' + (o.entrega === 'envio' ? 'Envío a ' + (o.direccion || '—') : 'Retiro'));
  if (o.pago) L.push('Pago: ' + o.pago);
  if (o.nota) L.push('Comentario: ' + o.nota);

}

function filteredOrders(){

    && (!q || (o.nombre + ' ' + o.codigo + ' ' + o.localidad + ' ' + (o.items || []).map(i => i.nombre).join(' ')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q)));
}
function listHTML(){
  if (!ordersReady) return '<div class="loading">' + (ordersErr ? esc(ordersErr) : 'Cargando pedidos…') + '</div>';

  if (!list.length) return '<div class="card emptybox"><h3>' + (ofilt.estado === 'abiertos' && !ofilt.q ? 'Está todo al día' : 'Nada con ese filtro') + '</h3><p style="margin:0">' + (ofilt.estado === 'abiertos' && !ofilt.q ? 'No hay pedidos nuevos ni confirmados pendientes de entrega.' : 'Probá con otro estado o borrá la búsqueda.') + '</p></div>';

  list.forEach(o => {
    const dk = sod(o.fecha);

  if (view === 'prendas' && t.dataset.vis){
    const p = ALL.find(x => x.id === t.dataset.vis); if (!p) return;
    try{ setData(await api('saveProduct', { product: Object.assign({}, p, { visible: t.checked }) })); renderPrendas(); toast(t.checked ? 'Visible en la tienda' : 'Oculta de la tienda'); }
    catch(err){ toast('No se pudo guardar: ' + err.message); t.checked = !t.checked; }
    return;
  }
  if (view === 'editar' && t.id === 'phIn') return addPhotos(t.files);
  if (view === 'editar' && t.closest('#edF')) edDirty = true;
  if (view === 'categorias' && t.dataset.mvto != null){ catEdit[t.dataset.mvto].moveTo = t.value; return; }
  if (view === 'ajustes' && t.id === 's-redondeo') updateCfgPreview();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'e-newt'){ e.preventDefault(); $('[data-act="addt"]').click(); }
  else if (e.target.id === 'newCat'){ e.preventDefault(); $('[data-act="cadd"]').click(); }
  else if (e.target.closest('#edF, #cfgF') && e.target.tagName === 'INPUT') e.preventDefault();
});
document.addEventListener('submit', e => { if (e.target.id !== 'loginF') e.preventDefault(); });
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { const dz = e.target.closest && e.target.closest('#drop'); if (dz){ e.preventDefault(); dz.classList.add('over'); } }));
document.addEventListener('dragleave', e => { const dz = e.target.closest && e.target.closest('#drop'); if (dz) dz.classList.remove('over'); });
document.addEventListener('drop', e => { const dz = e.target.closest && e.target.closest('#drop'); if (dz){ e.preventDefault(); dz.classList.remove('over'); addPhotos(e.dataTransfer.files); } });

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ------------------------------ sesión ------------------------------ */
function showLogin(err){
  if (!err && DEMO && /github\.io$/.test(location.hostname)) err = 'No se encontró config.js con la URL de la planilla. Revisá que esté subido junto a la tienda.';
  $('#app').hidden = true; $('#login').hidden = false;
  $('#l-demo').hidden = !DEMO;
  $('#l-err').hidden = !err; $('#l-err').textContent = err || '';
  $('#l-btn').disabled = false; $('#l-btn').textContent = 'Entrar';
  setTimeout(() => $('#l-pass').focus(), 50);
}
function showApp(){
  $('#login').hidden = true; $('#app').hidden = false; $('#demoPill').hidden = !DEMO;
  updateInstallBtn(); try{ history.replaceState(null, '', '#' + (view === 'editar' ? 'prendas' : view)); }catch(e){} render(); updateBadges();
  if (!ordersReady) poll();
}
function logout(){
  clearTimeout(pollT); KEY = null; store.del('tl_admin_key'); sess.set('tl_admin_key', null);
  drafts = {}; editing = null; view = 'pedidos'; ORDERS = []; ordersReady = false; updateBadges();
  $('#l-pass').value = ''; showLogin();
}
$('#loginF').addEventListener('submit', async e => {
  e.preventDefault();
  KEY = $('#l-pass').value.trim(); if (!KEY) return;
  $('#l-btn').disabled = true; $('#l-btn').textContent = 'Entrando…';
  try{
    setData(await api('login'));
    if ($('#l-rem').checked) store.set('tl_admin_key', KEY); else sess.set('tl_admin_key', KEY);
    showApp();
  }catch(err){ KEY = null; showLogin(err.message === 'Clave incorrecta' ? 'La clave no es correcta.' : err.message); }
});
(async function init(){
  if (window.TL_CONFIG && 'serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
  const h = location.hash.slice(1);
  if (VIEWS.some(v => v[0] === h)) view = h;
  try{ unlockAudio(); }catch(e){}
  if (!KEY) return showLogin();
  $('#app').hidden = false; $('#view').innerHTML = '<div class="loading">Cargando la tienda…</div>';
  $('#sideNav').innerHTML = navHTML(); $('#tabNav').innerHTML = navHTML();
  try{ setData(await api('catalogAdmin')); showApp(); }
  catch(err){ if (err.message === 'Clave incorrecta'){ store.del('tl_admin_key'); KEY = null; showLogin('La clave cambió. Entrá de nuevo.'); } else { $('#view').innerHTML = '<div class="card emptybox"><h3>No se pudo cargar</h3><p style="margin:0">' + esc(err.message) + '</p><button class="btn pri" onclick="location.reload()">Reintentar</button></div>'; } }
})();
</script>
